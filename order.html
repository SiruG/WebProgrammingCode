<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order - Local Bakery</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@600&family=Open+Sans&display=swap" rel="stylesheet">

  <!-- Unified stylesheet -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1 class="logo">Local Bakery</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="contact.html">Contact</a>
      <a href="feedback.html">Feedback</a>
      <a href="order.html">Order</a>
    </nav>
  </header>

  <main>
    <section class="order-form" style="max-width: 600px; margin: 3rem auto; background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);">
      <h2>Order Items</h2>
      <form action="#" method="post">
        <label for="order-name">Name:</label>
        <input type="text" id="order-name" name="order-name" placeholder="Your full name" required style="width: 100%; padding: 8px; margin: 5px 0 15px;" />

        <label for="order-email">Email:</label>
        <input type="email" id="order-email" name="order-email" placeholder="Your email" required style="width: 100%; padding: 8px; margin: 5px 0 15px;" />

        <label for="order-phone">Phone Number:</label>
        <input type="tel" id="order-phone" name="order-phone" placeholder="Your phone number" required style="width: 100%; padding: 8px; margin: 5px 0 15px;" />

        <label for="order-item">Select Item:</label>
        <select id="order-item" name="order-item" required style="width: 100%; padding: 8px; margin: 5px 0 15px;">
          <option value="">-- Select an item --</option>
          <option value="Chocolate Cake">Chocolate Cake</option>
          <option value="Blueberry Muffins">Blueberry Muffins</option>
          <option value="French Croissant">French Croissant</option>
          <option value="Cheese Bread">Cheese Bread</option>
          <option value="Strawberry Tart">Strawberry Tart</option>
        </select>

        <label for="order-quantity">Quantity:</label>
        <input type="number" id="order-quantity" name="order-quantity" min="1" max="20" value="1" required style="width: 100%; padding: 8px; margin: 5px 0 15px;" />

        <label for="order-address">Delivery Address:</label>
        <textarea id="order-address" name="order-address" rows="3" placeholder="Enter delivery address" required style="width: 100%; padding: 8px; margin: 5px 0 15px;"></textarea>

        <!-- Unified button -->
        <button type="submit" class="button button-cta">Place Order</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Contact us: <strong>localbakery@gmail.com</strong> | 📞 +977 9856875245</p>
    <p>&copy; 2025 Local Bakery. All rights reserved.</p>
  </footer>
</body>
</html>
